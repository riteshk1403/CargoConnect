spring.application.name=cargoconnect
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/cargoconnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

jwt.secret=cargoconnect-secret-key-for-development-use-only
jwt.expiration=86400000

spring.sql.init.mode=always
